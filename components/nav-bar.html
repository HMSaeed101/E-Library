<!--
  NAVBAR COMPONENT
  Uses root-relative paths for absolute reliability across all directories.
-->
<header class="header">
    <div class="logo-area">
        <a href="index.html" class="logo-link" aria-label="E-Library Home">
            <div class="logo-img">
                <img src="assets/img/ui/logo.svg" alt="E-Library Logo">
            </div>
            <div id="ee">E-Library</div>
        </a>
    </div>

    <div class="search-container">
        <form id="global-search-form" class="global-search-form">
            <input type="text" id="global-search-input" placeholder="Search books..." aria-label="Search books" autocomplete="off">
            <button type="submit" class="search-icon-btn" aria-label="Submit search">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </form>
        <div id="global-search-dropdown" class="search-dropdown"></div>
    </div>

    <!-- Hamburger Toggle for Mobile -->
    <button class="menu-toggle" aria-label="Toggle Menu" onclick="toggleMenu()">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>

    <nav class="nav-container">
        <div class="nav-links">
            <a href="index.html"><img src="assets/img/ui/home.svg" alt="" aria-hidden="true">Home</a>
            <a href="pages/books.html"><img src="assets/img/ui/book.svg" alt="" aria-hidden="true">Books</a>
            <a href="pages/categories.html"><img src="assets/img/ui/categories.svg" alt="" aria-hidden="true">Categories</a>
            <a href="pages/profile.html"><img src="assets/img/ui/profile.svg" alt="" aria-hidden="true">Profile</a>
            <button onclick="toggleDarkMode()" id="darkmode-btn">Theme</button>

        </div>
    </nav>
    <div class="scroll-progress-container">
        <div id="scroll-progress" class="scroll-progress-bar"></div>
    </div>
</header>
