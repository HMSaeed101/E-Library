<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg" href="../assets/img/ui/logo.svg" />
		<title>Book Details | E-Library</title>
		<link rel="stylesheet" href="../assets/css/index.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
			rel="stylesheet"
		/>
		<script type="module" src="../assets/js/app.js"></script>
	</head>
	<body>
		<div id="nav-bar" data-include="../components/nav-bar.html"></div>

		<main class="book-details-page">
			<!-- 1. Immersive Hero Section -->
			<header class="book-hero">
				<div class="hero-bg-blur"></div>
				<div class="hero-content container">
					<div class="book-cover-wrapper">
						<img src="" alt="Book Cover" class="book-cover skeleton" />
					</div>

					<div class="book-essential-info">
						<nav class="breadcrumb">
							<a href="../index.html">Home</a> / <a href="books.html">Library</a> / <span id="breadcrumb-title">Loading...</span>
						</nav>

						<h1 class="book-title">Loading Title...</h1>
						<p class="book-author">Loading Author...</p>

						<div class="meta-row">
							<!-- Meta items (published year, pages, language, rating) will be injected here -->
						</div>

						<div class="action-buttons">
							<button class="btn primary">Read Now</button>
							<button class="btn secondary">Add to Favorites</button>
							<button class="btn tertiary" title="Download PDF">
								Download
							</button>
						</div>
					</div>
				</div>
			</header>

			<!-- 2. Content Section -->
			<div class="book-content-grid container">
				<aside class="book-sidebar">
					<div class="sidebar-card details-card">
						<h3>Technical Specs</h3>
						<div class="details-grid">
							<!-- Detailed book info will be injected here -->
						</div>
					</div>
				</aside>

				<section class="book-main-content">
					<div class="description-wrapper">
						<h2>The Narrative</h2>
						<div class="book-description">
							<p>Loading description...</p>
						</div>
					</div>

					<div class="genres-wrapper">
						<h3>Classifications</h3>
						<div class="genres">
							<!-- Genres will be injected here -->
						</div>
					</div>
				</section>
			</div>

			<!-- 3. Discovery Section -->
			<section class="related-books-section container">
				<div class="section-header">
					<h3>More like this</h3>
				</div>
				<div id="relatedBooksGrid" class="book-grid">
					<!-- Related books will be injected here -->
				</div>
			</section>
		</main>

		<div id="footer" data-include="../components/footer.html"></div>
	</body>
</html>
