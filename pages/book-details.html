<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg" href="../assets/img/ui/logo.svg" />
		<title>Book Details | E-Library</title>
		<link rel="stylesheet" href="../assets/css/index.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
			rel="stylesheet"
		/>
		<script type="module" src="../assets/js/app.js"></script>
	</head>
	<body>
		<div id="nav-bar" data-include="../components/nav-bar.html"></div>

		<main class="book-container">
			<div class="book-header">
				<div class="book-cover-wrapper">
					<img src="" alt="Book Cover" class="book-cover" />
				</div>

				<div class="book-info">
					<h1 class="book-title">Loading Title...</h1>
					<p class="book-author">Loading Author...</p>

					<div class="meta-row">
						<!-- Meta items (published year, pages, language, rating) will be injected here -->
					</div>

					<div class="genres">
						<!-- Genres will be injected here -->
					</div>

					<div class="action-buttons">
						<button class="btn primary">Read Now</button>
						<button class="btn secondary">Add to Favorites</button>
						<button class="btn tertiary">Download PDF</button>
						<button id="sanctuaryToggle" class="btn outline" title="Focus Mode">
							<span class="icon">🌿</span> Sanctuary Mode
						</button>
					</div>
				</div>
			</div>

			<section class="book-description">
				<h2>Description</h2>
				<p>Loading description...</p>
			</section>

			<section class="book-details-section">
				<h2>Book Details</h2>
				<div class="details-grid">
					<!-- Detailed book info (publisher, ISBN, etc.) will be injected here -->
				</div>
			</section>
		</main>

		<div id="footer" data-include="../components/footer.html"></div>
	</body>
</html>
