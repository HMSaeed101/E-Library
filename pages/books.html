<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>E-Library | Books</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" type="image/svg" href="../assets/img/ui/logo.svg" />
	<link rel="stylesheet" href="../assets/css/index.css" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
		rel="stylesheet"
	/>
</head>

<body>
	<div id="nav-bar" data-include="../components/nav-bar.html"></div>

	<section class="hero-pages has-bg" id="books-hero-page">
		<h2>Multiverse of Books</h2>
		<p>Explore our collection of books across all categories.</p>

		<section class="search-books-page">
			<div class="search-box">
				<input
					type="text"
					id="searchInput"
					placeholder="Search books, authors, topics"
					autocomplete="off"
				/>
				<button class="search-btn" aria-label="Search">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
						<circle cx="11" cy="11" r="8"></circle>
						<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
					</svg>
				</button>

				<div class="search-dropdown" id="searchDropdown">
					<!-- Dynamic content will be injected here by JavaScript -->
				</div>
			</div>
		</section>

		<div class="filter-container">
			<button class="filter-pill active" data-category="all">All Collections</button>
			<button class="filter-pill" data-category="fiction">Fiction</button>
			<button class="filter-pill" data-category="non-fiction">Non-Fiction</button>
			<button class="filter-pill" data-category="science">Science</button>
			<button class="filter-pill" data-category="technology">Technology</button>
			<button class="filter-pill" data-category="nature">Nature</button>
			<button class="filter-pill" data-category="lifeandvalues">Life & Values</button>
			<button class="filter-pill" data-category="history">History</button>
		</div>
	</section>

	<section class="books-page-grid" id="booksGrid">
		<!-- Dynamic book cards will be injected here -->
	</section>

	<div id="footer" data-include="../components/footer.html"></div>

	<script type="module" src="../assets/js/app.js" defer></script>
</body>
</html>
